<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex AI Signal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #1a1e29;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .btn-open {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #0faf59;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(15, 175, 89, 0.4);
        }

        /* RT Button Styles */
        #rt-scanner-btn {
            position: fixed;
            top: 40%;
            right: 15px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0faf59, #005c28);
            border: 2px solid #00ff66;
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: move;
            box-shadow: 0 0 15px rgba(15, 175, 89, 0.8);
            z-index: 999999;
            user-select: none;
            touch-action: none;
        }
        .rt-scanning {
            animation: rt-pulse 0.5s infinite alternate;
            border-color: #ffcc00 !important;
        }
        .rt-locked {
            background: linear-gradient(135deg, #555555, #222222) !important;
            border-color: #888888 !important;
            cursor: not-allowed !important;
        }
        @keyframes rt-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>QUOTEX MARKET SCANNER</h2>
        <p>ট্রেডিং প্ল্যাটফর্ম চালু করতে নিচের বাটনে ক্লিক করুন:</p>
        <button class="btn-open" onclick="openQuotex()">Open Market</button>
    </div>

    <!-- RT Floating Button -->
    <div id="rt-scanner-btn">RT</div>

    <script>
        const targetUrl = "https://market-qx.trade/sign-up/?lid=960233";
        let isChartOpened = false;
        let isAuthorized = false;
        let isLocked = false;

        function openQuotex() {
            window.open(targetUrl, "_blank");
            isChartOpened = true;
        }

        const btn = document.getElementById("rt-scanner-btn");

        // Draggable Functionality
        let isDragging = false, hasMoved = false, offsetX, offsetY;

        function startDrag(e) {
            isDragging = true;
            hasMoved = false;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            offsetX = clientX - btn.getBoundingClientRect().left;
            offsetY = clientY - btn.getBoundingClientRect().top;
        }

        function moveDrag(e) {
            if (!isDragging) return;
            hasMoved = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            btn.style.left = (clientX - offsetX) + "px";
            btn.style.top = (clientY - offsetY) + "px";
            btn.style.right = "auto";
        }

        function stopDrag() { isDragging = false; }

        btn.addEventListener("mousedown", startDrag);
        btn.addEventListener("mousemove", moveDrag);
        window.addEventListener("mouseup", stopDrag);
        btn.addEventListener("touchstart", startDrag, { passive: true });
        btn.addEventListener("touchmove", moveDrag, { passive: true });
        window.addEventListener("touchend", stopDrag);

        // RT Button Click Actions
        btn.addEventListener("click", function() {
            if (hasMoved || btn.classList.contains("rt-scanning") || isLocked) return;

            // ১. চার্ট ওপেন না থাকলে মেসেজ
            if (!isChartOpened) {
                alert("QUOTEX MARKET OPEN");
                return;
            }

            // ২. প্রিমিয়াম এক্সেস কী চেক
            if (!isAuthorized) {
                let userKey = prompt("PREMIUM Access key 🔐");
                if (userKey === "MT") {
                    isAuthorized = true;
                    alert("Access Granted Successfully!");
                } else {
                    alert("Invalid Access Key!");
                    return;
                }
            }

            // ৩. ৩-৫ সেকেন্ড স্ক্যানিং
            btn.classList.add("rt-scanning");
            btn.innerText = "...";

            setTimeout(function() {
                btn.classList.remove("rt-scanning");
                
                // র্যান্ডম UP/DOWN বিশ্লেষণ সিগন্যাল
                const signal = Math.random() > 0.5 ? "CALL (UP) ⬆️" : "PUT (DOWN) ⬇️";
                alert("Signal Generated: " + signal);

                // ৪. ২ মিনিট লক
                isLocked = true;
                btn.classList.add("rt-locked");
                let timeLeft = 120;

                let lockInterval = setInterval(function() {
                    let mins = Math.floor(timeLeft / 60);
                    let secs = timeLeft % 60;
                    btn.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    timeLeft--;

                    if (timeLeft < 0) {
                        clearInterval(lockInterval);
                        isLocked = false;
                        btn.classList.remove("rt-locked");
                        btn.innerText = "RT";
                    }
                }, 1000);

            }, 4000);
        });
    </script>
</body>
</html>
