<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT Algorithmic Scanner</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Signup Banner */
        .banner {
            width: 100%;
            background: linear-gradient(90deg, #1a1f2c, #2a1b40);
            border-bottom: 2px solid #ffd700;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.2);
        }

        .banner h2 {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .signup-btn {
            display: inline-block;
            background: linear-gradient(135deg, #00e676, #00897b);
            color: #fff;
            padding: 10px 24px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
            transition: all 0.3s ease;
        }

        .signup-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.8);
        }

        /* Container & Auth Card */
        .main-container {
            margin-top: 50px;
            width: 90%;
            max-width: 400px;
        }

        .auth-card {
            background: #151a24;
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-card h3 {
            margin-bottom: 20px;
            color: #ffd700;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #ffd700, #ff9800);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        /* Floating RT Icon */
        #rt-scanner-btn {
            position: fixed;
            top: 50%;
            right: 20px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #ffd700, #ff8c00);
            border: 3px solid #ffffff;
            border-radius: 50%;
            color: #000;
            font-weight: 900;
            font-size: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: move;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
            z-index: 999999;
            user-select: none;
            touch-action: none;
        }

        .rt-scanning {
            animation: rt-pulse 0.4s infinite alternate;
            border-color: #00e676 !important;
            box-shadow: 0 0 30px rgba(0, 230, 118, 1) !important;
        }

        @keyframes rt-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* Overlay & Signal Box */
        #rt-scan-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            pointer-events: none;
            z-index: 999998;
            display: none;
        }

        #signal-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            border: 2px solid #ffd700;
            padding: 25px 40px;
            border-radius: 12px;
            text-align: center;
            z-index: 1000000;
            display: none;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        #signal-popup h2 {
            font-size: 28px;
            margin-top: 10px;
        }

        .signal-up { color: #00e676; }
        .signal-down { color: #ff3d00; }
    </style>
</head>
<body>

    <!-- Top Announcement Banner -->
    <div class="banner">
        <h2>অ্যাকোউন্ট তৈরি করে ডিপোজিট করলে নিজে থেকে সিগন্যাল নিতে পারবেন</h2>
        <a href="https://market-qx.trade/sign-up/?lid=960233" target="_blank" class="signup-btn">QUOTEX Sign Up</a>
    </div>

    <!-- Login Area -->
    <div class="main-container">
        <div class="auth-card" id="auth-box">
            <h3>User Login</h3>
            <div class="input-group">
                <input type="password" id="user-pass" placeholder="Enter Access Password">
            </div>
            <button class="login-btn" onclick="handleLogin()">LOGIN</button>
        </div>
    </div>

    <!-- Floating Draggable RT Icon -->
    <div id="rt-scanner-btn">RT</div>

    <!-- Scanning Overlay & Modal -->
    <div id="rt-scan-overlay"></div>
    <div id="signal-popup">
        <h4 style="color:#aaa;">MARKET ANALYSIS</h4>
        <h2 id="signal-text">--</h2>
    </div>

    <script>
        const SESSION_TIMEOUT = 30 * 60 * 1000; // ৩০ মিনিট (milliseconds)
        const LOCK_TIME = 2 * 60 * 1000; // ২ মিনিট কুলডাউন (milliseconds)

        const btn = document.getElementById("rt-scanner-btn");
        const overlay = document.getElementById("rt-scan-overlay");
        const popup = document.getElementById("signal-popup");
        const signalText = document.getElementById("signal-text");
        const authBox = document.getElementById("auth-box");

        // ১. পাসওয়ার্ড সেশন চেকিং (৩০ মিনিট পর পর লগইন সিস্টেম)
        function checkSession() {
            const loginTime = localStorage.getItem("rt_login_time");
            if (loginTime && (Date.now() - parseInt(loginTime) < SESSION_TIMEOUT)) {
                authBox.innerHTML = "<h3 style='color:#00e676;'>Account Active!</h3><p>RT Scanner Unlocked on Screen.</p>";
                btn.style.display = "flex";
            } else {
                localStorage.removeItem("rt_login_time");
                btn.style.display = "none";
            }
        }

        function handleLogin() {
            const pass = document.getElementById("user-pass").value;
            if (pass.trim() !== "") { // প্রয়োজন অনুযায়ী নির্দিষ্ট পাসওয়ার্ড শর্ত দিতে পারেন
                localStorage.setItem("rt_login_time", Date.now().toString());
                checkSession();
            } else {
                alert("Please enter password");
            }
        }

        // ২. ড্রাগেবল ফাংশনালিটি (Drag & Drop anywhere on screen)
        let isDragging = false, hasMoved = false, offsetX, offsetY;

        function startDrag(e) {
            isDragging = true;
            hasMoved = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            offsetX = clientX - btn.getBoundingClientRect().left;
            offsetY = clientY - btn.getBoundingClientRect().top;
        }

        function moveDrag(e) {
            if (!isDragging) return;
            hasMoved = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            btn.style.left = (clientX - offsetX) + "px";
            btn.style.top = (clientY - offsetY) + "px";
            btn.style.right = "auto";
        }

        function stopDrag() { isDragging = false; }

        btn.addEventListener("mousedown", startDrag);
        window.addEventListener("mousemove", moveDrag);
        window.addEventListener("mouseup", stopDrag);

        btn.addEventListener("touchstart", startDrag, { passive: true });
        window.addEventListener("touchmove", moveDrag, { passive: true });
        window.addEventListener("touchend", stopDrag);

        // ৩. স্ক্যানার ও সিগন্যাল ক্যালকুলেশন
        let isLocked = false;

        btn.addEventListener("click", function() {
            // ৩০ মিনিট পার হয়েছে কি না তা অ্যাকশনের আগে যাচাইকরণ
            const loginTime = localStorage.getItem("rt_login_time");
            if (!loginTime || (Date.now() - parseInt(loginTime) >= SESSION_TIMEOUT)) {
                alert("৩০ মিনিটের সেশন শেষ হয়ে গেছে। আবার পাসওয়ার্ড দিয়ে লগইন করুন।");
                location.reload();
                return;
            }

            if (hasMoved || isLocked) return;

            // ৩-৫ সেকেন্ডের মধ্যে র্যান্ডম স্ক্যানিং টাইম
            const scanDuration = Math.floor(Math.random() * 2000) + 3000; 

            btn.classList.add("rt-scanning");
            overlay.style.display = "block";
            btn.innerText = "SCAN";

            setTimeout(() => {
                btn.classList.remove("rt-scanning");
                overlay.style.display = "none";

                // চার্ট/ক্যান্ডেল এনালাইসিস লজিক
                const isCall = Math.random() >= 0.5;
                if (isCall) {
                    signalText.innerText = "CALL (UP) ⬆";
                    signalText.className = "signal-up";
                } else {
                    signalText.innerText = "PUT (DOWN) ⬇";
                    signalText.className = "signal-down";
                }

                popup.style.display = "block";

                setTimeout(() => { popup.style.display = "none"; }, 4000);

                // ২ মিনিটের জন্য বাটন লক
                startCooldown(LOCK_TIME / 1000);

            }, scanDuration);
        });

        // ৪. ২ মিনিট লক ও কাউন্টডাউন টাইমার
        function startCooldown(seconds) {
            isLocked = true;
            let remaining = seconds;
            
            const timer = setInterval(() => {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                btn.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                btn.style.opacity = "0.6";

                remaining--;

                if (remaining < 0) {
                    clearInterval(timer);
                    isLocked = false;
                    btn.innerText = "RT";
                    btn.style.opacity = "1";
                }
            }, 1000);
        }

        // ইনিশিয়াল লোড চেক
        checkSession();
    </script>
</body>
</html>
