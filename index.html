<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Market Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background-color: #0d1117; color: #fff; }

        /* Iframe styling for the Quotex site */
        #trading-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Floating RT Icon Styling */
        #rt-scanner-btn {
            position: fixed;
            top: 30%;
            right: 20px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #0faf59, #005c28);
            border: 3px solid #00ff66;
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(15, 175, 89, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.4);
            z-index: 999999;
            user-select: none;
            touch-action: none;
        }

        /* Scanning State Animation */
        .rt-scanning {
            animation: rt-pulse 0.5s infinite alternate;
            border-color: #ffcc00 !important;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.9) !important;
        }
        @keyframes rt-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* Overlay scanning effect */
        #rt-scan-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 175, 89, 0.12);
            border: 4px solid #0faf59;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 999998;
            display: none;
        }

        /* Modal Box for Key Verification & Notifications */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #161b22;
            padding: 25px;
            border: 1px solid #30363d;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            text-align: center;
            font-size: 16px;
        }
        .modal-content button {
            background: #0faf59;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Signal Result Popup */
        #signal-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #161b22;
            border: 2px solid #0faf59;
            padding: 15px 25px;
            border-radius: 30px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            display: none;
            z-index: 999999;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Embedded Trading Site -->
    <iframe id="trading-frame" src="https://market-qx.trade/sign-up/?lid=960233"></iframe>

    <!-- Floating RT Button -->
    <div id="rt-scanner-btn">RT</div>
    <div id="rt-scan-overlay"></div>

    <!-- Signal Result Box -->
    <div id="signal-popup"></div>

    <!-- Password Modal -->
    <div id="keyModal" class="modal">
        <div class="modal-content">
            <h3>PREMIUM Access Key 🔐</h3>
            <input type="password" id="accessKeyInput" placeholder="Enter Key Here">
            <button onclick="verifyKey()">Submit</button>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="modal">
        <div class="modal-content">
            <h3 id="alertMessage"></h3>
            <br>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>

    <script>
        var isUnlocked = false;
        var isLockedTimer = false;
        var isDragging = false, hasMoved = false, offsetX, offsetY;

        var btn = document.getElementById("rt-scanner-btn");
        var overlay = document.getElementById("rt-scan-overlay");
        var keyModal = document.getElementById("keyModal");
        var alertModal = document.getElementById("alertModal");
        var alertMessage = document.getElementById("alertMessage");
        var signalPopup = document.getElementById("signal-popup");

        // Drag functionality
        function startDrag(e) {
            isDragging = true;
            hasMoved = false;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
            offsetX = clientX - btn.getBoundingClientRect().left;
            offsetY = clientY - btn.getBoundingClientRect().top;
        }

        function moveDrag(e) {
            if (!isDragging) return;
            hasMoved = true;
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
            btn.style.left = (clientX - offsetX) + "px";
            btn.style.top = (clientY - offsetY) + "px";
            btn.style.right = "auto";
        }

        function stopDrag() { isDragging = false; }

        btn.addEventListener("mousedown", startDrag);
        window.addEventListener("mousemove", moveDrag);
        window.addEventListener("mouseup", stopDrag);
        btn.addEventListener("touchstart", startDrag, { passive: true });
        window.addEventListener("touchmove", moveDrag, { passive: true });
        window.addEventListener("touchend", stopDrag);

        // Alert helper
        function showAlert(msg) {
            alertMessage.innerText = msg;
            alertModal.style.display = "flex";
        }
        function closeAlert() {
            alertModal.style.display = "none";
        }

        // Verify Key "MT"
        function verifyKey() {
            var input = document.getElementById("accessKeyInput").value;
            if (input === "MT") {
                isUnlocked = true;
                keyModal.style.display = "none";
                showAlert("Access Granted! Market scanner activated.");
            } else {
                showAlert("Incorrect Key! Please try again.");
            }
        }

        // Handle RT Button Click
        btn.addEventListener("click", function() {
            if (hasMoved) return;

            // Step 1: Check access key
            if (!isUnlocked) {
                keyModal.style.display = "flex";
                return;
            }

            // Step 2: Check 2-minute cooldown lock
            if (isLockedTimer) {
                showAlert("QUOTEX MARKET OPEN - Please wait for timer to unlock.");
                return;
            }

            if (btn.classList.contains("rt-scanning")) return;

            // Step 3: 3 to 5 second scanning phase
            btn.classList.add("rt-scanning");
            overlay.style.display = "block";
            btn.innerText = "WAIT";

            // Random scan time between 3000ms and 5000ms
            var scanDuration = Math.floor(Math.random() * 2000) + 3000;

            setTimeout(function() {
                btn.classList.remove("rt-scanning");
                overlay.style.display = "none";

                // Generate signal (UP / DOWN analysis)
                var isCall = Math.random() >= 0.5;
                var signalText = isCall ? "CALL (UP) ⬆️" : "PUT (DOWN) ⬇️";
                
                signalPopup.innerText = "SIGNAL: " + signalText;
                signalPopup.style.borderColor = isCall ? "#00ff66" : "#ff3336";
                signalPopup.style.display = "block";

                setTimeout(function() {
                    signalPopup.style.display = "none";
                }, 4000);

                // Step 4: Lock button for 2 minutes (120 seconds)
                startCooldown(120);

            }, scanDuration);
        });

        // 2-minute Cooldown Logic
        function startCooldown(seconds) {
            isLockedTimer = true;
            var remaining = seconds;
            
            btn.style.background = "#555555";
            btn.style.borderColor = "#888888";

            var interval = setInterval(function() {
                var mins = Math.floor(remaining / 60);
                var secs = remaining % 60;
                btn.innerText = (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
                
                remaining--;

                if (remaining < 0) {
                    clearInterval(interval);
                    isLockedTimer = false;
                    btn.innerText = "RT";
                    btn.style.background = "linear-gradient(135deg, #0faf59, #005c28)";
                    btn.style.borderColor = "#00ff66";
                }
            }, 1000);
        }
    </script>
</body>
</html>
