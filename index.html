<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT Scanner & Signal System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }

        /* Fullscreen Webview iframe */
        #trading-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Floating RT Icon */
        #rt-scanner-btn {
            position: fixed;
            top: 40%;
            right: 20px;
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #0faf59, #005c28);
            border: 2px solid #00ff66;
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(15, 175, 89, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.4);
            z-index: 99999;
            user-select: none;
            touch-action: none;
            transition: transform 0.2s;
        }
        
        #rt-scanner-btn:active {
            transform: scale(0.95);
        }

        .rt-scanning {
            animation: rt-pulse 0.6s infinite alternate;
            border-color: #ffcc00 !important;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.9) !important;
        }

        @keyframes rt-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* Locked State Style */
        .rt-locked {
            background: linear-gradient(135deg, #444, #111) !important;
            border-color: #888 !important;
            box-shadow: none !important;
            cursor: not-allowed !important;
            font-size: 14px !important;
        }

        /* Custom Modal Box (Key Access & Signal Display) */
        .rt-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 999999;
            align-items: center;
            justify-content: center;
        }

        .rt-modal-content {
            background: #111827;
            border: 1px solid #00ff66;
            border-radius: 12px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
        }

        .rt-modal-content h3 {
            margin-bottom: 15px;
            color: #00ff66;
            font-size: 20px;
        }

        .rt-modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .rt-modal-content button {
            background: #0faf59;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        /* Scanning Visual Overlay */
        #rt-scan-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 175, 89, 0.05);
            border: 4px solid #00ff66;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 99998;
            display: none;
        }

        .signal-badge {
            font-size: 32px;
            font-weight: 900;
            margin: 15px 0;
        }
        .signal-up { color: #00ff66; }
        .signal-down { color: #ff334b; }
    </style>
</head>
<body>

    <!-- Embedded Trading Site -->
    <iframe id="trading-frame" src="https://market-qx.trade/sign-up/?lid=960233"></iframe>

    <!-- Floating Draggable Icon -->
    <div id="rt-scanner-btn">RT</div>

    <!-- Visual Scanner Edge Frame -->
    <div id="rt-scan-overlay"></div>

    <!-- Access Key Modal -->
    <div id="key-modal" class="rt-modal">
        <div class="rt-modal-content">
            <h3>PREMIUM Access Key 🔐</h3>
            <p style="font-size: 14px; color: #9ca3af;">enter your premium access key to use the scanner.</p>
            <input type="password" id="access-key-input" placeholder="Enter Access Key">
            <button id="submit-key-btn">SUBMIT</button>
        </div>
    </div>

    <!-- Signal Display Modal -->
    <div id="signal-modal" class="rt-modal">
        <div class="rt-modal-content">
            <h3 id="signal-status-title">ANALYZING...</h3>
            <div id="signal-result-body">
                <p style="font-size: 14px; color: #9ca3af;">Matching Candlesticks & Chart Indicators...</p>
            </div>
            <button id="close-signal-btn" style="display:none; margin-top: 15px;">OK</button>
        </div>
    </div>

    <script>
        // Access State Management
        let isKeyUnlocked = false;
        let isCooldown = false;
        let cooldownTimer = null;

        const rtBtn = document.getElementById("rt-scanner-btn");
        const keyModal = document.getElementById("key-modal");
        const signalModal = document.getElementById("signal-modal");
        const overlay = document.getElementById("rt-scan-overlay");
        const submitKeyBtn = document.getElementById("submit-key-btn");
        const keyInput = document.getElementById("access-key-input");
        const signalStatusTitle = document.getElementById("signal-status-title");
        const signalResultBody = document.getElementById("signal-result-body");
        const closeSignalBtn = document.getElementById("close-signal-btn");

        // Draggable Logic
        let isDragging = false, hasMoved = false, offsetX, offsetY;

        function startDrag(e) {
            isDragging = true;
            hasMoved = false;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            offsetX = clientX - rtBtn.getBoundingClientRect().left;
            offsetY = clientY - rtBtn.getBoundingClientRect().top;
        }

        function moveDrag(e) {
            if (!isDragging) return;
            hasMoved = true;
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            rtBtn.style.left = (clientX - offsetX) + "px";
            rtBtn.style.top = (clientY - offsetY) + "px";
            rtBtn.style.right = "auto";
        }

        function stopDrag() { isDragging = false; }

        rtBtn.addEventListener("mousedown", startDrag);
        window.addEventListener("mousemove", moveDrag);
        window.addEventListener("mouseup", stopDrag);
        rtBtn.addEventListener("touchstart", startDrag, { passive: true });
        window.addEventListener("touchmove", moveDrag, { passive: true });
        window.addEventListener("touchend", stopDrag);

        // Click Event Logic
        rtBtn.addEventListener("click", function() {
            if (hasMoved) return; // Prevent triggering click during drag

            if (isCooldown) return;

            // 1. If key is not unlocked, show key prompt
            if (!isKeyUnlocked) {
                keyModal.style.display = "flex";
                return;
            }

            // 2. Start Scanning & Signal Process
            runMarketScanner();
        });

        // Key Validation Logic
        submitKeyBtn.addEventListener("click", function() {
            const val = keyInput.value.trim();
            if (val === "MT") {
                isKeyUnlocked = true;
                keyModal.style.display = "none";
                alert("Premium Access Granted!");
            } else {
                alert("Invalid Key! Please try again.");
            }
        });

        // Market Scanning and Indicator Analysis Execution
        function runMarketScanner() {
            rtBtn.classList.add("rt-scanning");
            overlay.style.display = "block";
            
            // Random scanning duration between 3 to 5 seconds
            const scanTime = Math.floor(Math.random() * 2000) + 3000;

            signalModal.style.display = "flex";
            signalStatusTitle.innerText = "SCANNING MARKET...";
            signalResultBody.innerHTML = `<p style="font-size:14px; color:#ffcc00;">Analyzing Chart Indicators & Price Action (${(scanTime/1000).toFixed(1)}s)...</p>`;
            closeSignalBtn.style.display = "none";

            setTimeout(() => {
                rtBtn.classList.remove("rt-scanning");
                overlay.style.display = "none";

                // Generate Trading Signal (UP or DOWN)
                const isUp = Math.random() >= 0.5;
                const signalText = isUp ? "CALL (UP) ⬆" : "PUT (DOWN) ⬇";
                const signalClass = isUp ? "signal-up" : "signal-down";

                signalStatusTitle.innerText = "SIGNAL GENERATED";
                signalResultBody.innerHTML = `
                    <div class="signal-badge ${signalClass}">${signalText}</div>
                    <p style="font-size:13px; color:#9ca3af;">Duration: 1-MIN | Accuracy: High</p>
                `;
                closeSignalBtn.style.display = "block";

                // Trigger 2 Minutes Cooldown Lock
                startCooldown(120);

            }, scanTime);
        }

        closeSignalBtn.addEventListener("click", () => {
            signalModal.style.display = "none";
        });

        // 2-Minute Lock Countdown Logic
        function startCooldown(seconds) {
            isCooldown = true;
            rtBtn.classList.add("rt-locked");
            let remaining = seconds;

            updateTimerText(remaining);

            cooldownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(cooldownTimer);
                    isCooldown = false;
                    rtBtn.classList.remove("rt-locked");
                    rtBtn.innerText = "RT";
                } else {
                    updateTimerText(remaining);
                }
            }, 1000);
        }

        function updateTimerText(sec) {
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            rtBtn.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
