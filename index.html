<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT Algorithmic Trading Terminal</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(16, 24, 40, 0.75);
            --neon-green: #00ff66;
            --neon-gold: #ffcc00;
            --neon-red: #ff3366;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 255, 102, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 204, 0, 0.1), transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .banner {
            background: linear-gradient(135deg, rgba(255, 204, 0, 0.2), rgba(0, 255, 102, 0.2));
            border: 1px solid var(--neon-gold);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .banner p {
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 600;
            line-height: 1.5;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--neon-green);
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-signup {
            background: linear-gradient(135deg, #0faf59, #005c28);
            color: #fff;
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }

        .btn-signup:hover {
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.6);
            transform: translateY(-2px);
        }

        .btn-login {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-login:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--neon-green);
        }

        /* Float/Draggable RT Button */
        #rt-scanner-btn {
            position: fixed;
            top: 40%;
            right: 20px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #00ff66 0%, #005c28 100%);
            border: 2px solid var(--neon-green);
            border-radius: 50%;
            color: #ffffff;
            font-weight: 900;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: move;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 999999;
            user-select: none;
            touch-action: none;
        }

        .rt-scanning {
            animation: rt-pulse 0.4s infinite alternate;
            border-color: var(--neon-gold) !important;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.9) !important;
        }

        @keyframes rt-pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        /* Signal Modal Dialog */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #0d131d;
            border: 2px solid var(--neon-green);
            border-radius: 16px;
            padding: 25px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.4);
        }

        .signal-box {
            font-size: 28px;
            font-weight: 900;
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .signal-up {
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            background: rgba(0, 255, 102, 0.1);
        }

        .signal-down {
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            background: rgba(255, 51, 102, 0.1);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <div class="banner">
            <p>🔥 অ্যাকাউন্ট তৈরি করে ডিপোজিট করলে নিজে থেকে সিগন্যাল নিতে পারবেন।</p>
        </div>

        <div class="card" id="auth-card">
            <h2>RT TERMINAL</h2>
            <div class="btn-group">
                <a href="https://market-qx.trade/sign-up/?lid=960233" target="_blank" class="btn btn-signup">
                    QUOTEX SIGN UP
                </a>
                <button class="btn btn-login" onclick="showLoginForm()">LOGIN</button>
            </div>

            <div id="login-form" class="hidden" style="margin-top: 20px;">
                <div class="form-group">
                    <label>Username / User ID</label>
                    <input type="text" id="username" placeholder="Enter ID">
                </div>
                <button class="btn btn-signup" onclick="handleLogin()">ACCESS DASHBOARD</button>
            </div>
        </div>

        <div class="card hidden" id="dashboard-card">
            <h2>TRADING DASHBOARD</h2>
            <p style="text-align: center; color: #94a3b8; font-size: 14px;">
                ড্যাশবোর্ডে স্বাগতম। স্ক্রিনে ভাসমান <b>RT</b> আইকনটিতে ক্লিক করে স্ক্যানিং শুরু করুন।
            </p>
        </div>
    </div>

    <div id="rt-scanner-btn" class="hidden">RT</div>

    <div class="modal" id="system-modal">
        <div class="modal-content">
            <h3 id="modal-title" style="color: var(--neon-gold); margin-bottom: 10px;">Security Verification</h3>
            <div id="modal-body">
                </div>
        </div>
    </div>

<script>
    // System Constants
    const REQUIRED_PASSWORD = "3311";
    const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 Minutes
    const LOCK_TIMEOUT = 2 * 60 * 1000;     // 2 Minutes Lockout

    // State Variables
    let isLoggedIn = false;
    let lastAuthTime = 0;
    let lastScanTime = 0;

    // View Switching Logic
    function showLoginForm() {
        document.getElementById('login-form').classList.remove('hidden');
    }

    function handleLogin() {
        const user = document.getElementById('username').value;
        if (!user) {
            alert("অনুগ্রহ করে ইউজার আইডি প্রদান করুন");
            return;
        }
        isLoggedIn = true;
        document.getElementById('auth-card').classList.add('hidden');
        document.getElementById('dashboard-card').classList.remove('hidden');
        document.getElementById('rt-scanner-btn').classList.remove('hidden');
    }

    // Modal UI Helpers
    function openModal(title, htmlContent) {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-body').innerHTML = htmlContent;
        document.getElementById('system-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('system-modal').style.display = 'none';
    }

    // Password Check Process
    function checkAuthAndProceed(callback) {
        const now = Date.now();
        if (!lastAuthTime || (now - lastAuthTime) > SESSION_TIMEOUT) {
            // Prompt Password
            const formHTML = `
                <p style="font-size:13px; color:#ccc; margin-bottom:12px;">অ্যাক্সেস এর জন্য পাসওয়ার্ড প্রয়োজন (প্রতি ৩০ মিনিটে একবার)</p>
                <input type="password" id="rt-pass-input" style="width:100%; padding:10px; margin-bottom:12px; background:#000; border:1px solid #333; color:#fff; border-radius:6px; text-align:center;" placeholder="Enter Password">
                <button class="btn btn-signup" onclick="verifyPassword()">SUBMIT</button>
            `;
            openModal("ENTER PASSWORD", formHTML);
            
            window.verifyPassword = function() {
                const pass = document.getElementById('rt-pass-input').value;
                if (pass === REQUIRED_PASSWORD) {
                    lastAuthTime = Date.now();
                    closeModal();
                    callback();
                } else {
                    alert("ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।");
                }
            };
        } else {
            callback();
        }
    }

    // Floating Draggable Icon Logic
    const btn = document.getElementById("rt-scanner-btn");
    let isDragging = false, hasMoved = false, offsetX, offsetY;

    function startDrag(e) {
        isDragging = true;
        hasMoved = false;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        offsetX = clientX - btn.getBoundingClientRect().left;
        offsetY = clientY - btn.getBoundingClientRect().top;
    }

    function moveDrag(e) {
        if (!isDragging) return;
        hasMoved = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        btn.style.left = (clientX - offsetX) + "px";
        btn.style.top = (clientY - offsetY) + "px";
        btn.style.right = "auto";
    }

    function stopDrag() { isDragging = false; }

    btn.addEventListener("mousedown", startDrag);
    window.addEventListener("mousemove", moveDrag);
    window.addEventListener("mouseup", stopDrag);
    btn.addEventListener("touchstart", startDrag, { passive: true });
    window.addEventListener("touchmove", moveDrag, { passive: true });
    window.addEventListener("touchend", stopDrag);

    // Core Scanner Logic
    btn.addEventListener("click", function() {
        if (hasMoved) return;

        // Check 2 Minutes Lock
        const now = Date.now();
        if (lastScanTime && (now - lastScanTime) < LOCK_TIMEOUT) {
            const remainingSec = Math.ceil((LOCK_TIMEOUT - (now - lastScanTime)) / 1000);
            alert(`RT সম্পূর্ণ লক আছে! অনুগ্রহ করে ${remainingSec} সেকেন্ড অপেক্ষা করুন।`);
            return;
        }

        // Verify 30-min Password Session
        checkAuthAndProceed(() => {
            executeScanner();
        });
    });

    function executeScanner() {
        btn.classList.add("rt-scanning");
        btn.innerText = "SCAN";

        // 4 Seconds Scanning Animation
        setTimeout(() => {
            btn.classList.remove("rt-scanning");
            btn.innerText = "RT";
            lastScanTime = Date.now();

            // Calculate Decision Logic (Simulated Market/Candle Data Scan)
            const callScore = Math.floor(Math.random() * 10) + 1;
            const putScore = Math.floor(Math.random() * 10) + 1;
            const isCall = callScore >= putScore;

            const signalClass = isCall ? "signal-up" : "signal-down";
            const signalText = isCall ? "CALL (UP) ⬆" : "PUT (DOWN) ⬇";

            const resultHTML = `
                <p style="font-size:12px; color:#aaa;">ক্যান্ডেলস্টিক ও ইন্ডিকেটর অ্যানালাইসিস সম্পন্ন</p>
                <div class="signal-box ${signalClass}">${signalText}</div>
                <p style="font-size:12px; color:#888; margin-bottom:15px;">পরবর্তী স্ক্যান ২ মিনিটের জন্য লক থাকবে</p>
                <button class="btn btn-login" onclick="closeModal()">CLOSE</button>
            `;

            openModal("MARKET DIRECTION", resultHTML);

        }, 4000); // ৩-৫ সেকেন্ড এর মাঝের মান (৪ সেকেন্ড স্ক্যান)
    }
</script>
</body>
</html>
